<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="description" content="Survive the void, evolve your ship, and face cosmic bosses in Void Survivors." />
    <meta name="theme-color" content="#05060f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="Void Survivors" />
    <meta property="og:description" content="A cosmic survival shooter with evolving ships, abilities, and bosses." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Void Survivors</title>

    <!-- Font inclusi nel gioco (nessun servizio esterno): caricamento immediato -->
    <link rel="preconnect" href="https://bridge.playgama.com" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="./fonts/orbitron-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="./fonts/exo2-latin.woff2" crossorigin />
    <link rel="preload" as="image" href="./assets/bg_nebula.webp" type="image/webp" />

    <!-- Playgama Bridge: caricato in modo asincrono, il gioco lo attende da solo (playgame.ts) -->
    <script async src="https://bridge.playgama.com/v2/stable/playgama-bridge.js" onerror="window.__bridgeFailed = true"></script>

    <style>
      @font-face { font-family: "Orbitron"; font-style: normal; font-weight: 400 900; font-display: swap; src: url("./fonts/orbitron-latin.woff2") format("woff2"); }
      @font-face { font-family: "Exo 2"; font-style: normal; font-weight: 100 900; font-display: swap; src: url("./fonts/exo2-latin.woff2") format("woff2"); }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #05060f; color: #eef2ff; overflow: hidden; }
      #vs-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: radial-gradient(900px 600px at 50% 40%, rgba(168, 85, 247, 0.18), transparent 60%), #05060f;
        font-family: "Orbitron", "Exo 2", system-ui, sans-serif;
      }
      #vs-splash .t { font-weight: 900; font-size: clamp(1.8rem, 7vw, 3.2rem); letter-spacing: 0.2em; padding-left: 0.2em;
        background: linear-gradient(100deg, #22d3ee, #a855f7 55%, #ec4899); -webkit-background-clip: text; background-clip: text; color: transparent; }
      #vs-splash .b { width: min(240px, 60vw); height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
      #vs-splash .b i { display: block; width: 40%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #22d3ee, #a855f7); animation: vs-load 1.1s ease-in-out infinite; }
      @keyframes vs-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="vs-splash" role="status" aria-label="Loading"><div class="t">VOID SURVIVORS</div><div class="b"><i></i></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
